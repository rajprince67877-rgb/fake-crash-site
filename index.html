<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Supreme Card Vault — Demo</title>

<meta name="description"
content="Supreme Card Vault demo page">

<style>
body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.box {
    width: 90%;
    max-width: 430px;
}

.logo {
    font-size: 65px;
    margin-bottom: 15px;
}

h1 {
    font-size: 30px;
    margin: 10px 0;
}

p {
    color: #aaa;
}

.bar {
    height: 7px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 25px;
}

.loading {
    height: 100%;
    width: 0%;
    background: white;
    animation: load 3s forwards;
}

@keyframes load {
    to {
        width: 100%;
    }
}

button {
    margin-top: 25px;
    padding: 12px 22px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.demo {
    font-size: 12px;
    color: #666;
    margin-top: 25px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">💳</div>

    <h1>Supreme Card Vault</h1>

    <p id="message">Loading vault...</p>

    <div class="bar">
        <div class="loading"></div>
    </div>

    <button onclick="location.reload()">Try Again</button>

    <div class="demo">
        DEMO / PRANK PAGE — No real card data is collected.
    </div>

</div>

<script>
setTimeout(function() {
    document.getElementById("message").innerText =
        "Oops! Something went wrong 😈";
}, 3500);
</script>

</body>
</html>
